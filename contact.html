<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - 4-testing</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-contact">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32">
      <rect class="logo-bg" width="32" height="32" rx="7"/>
      <path class="logo-check" d="M9 17l5 5 9-11"/>
    </symbol>
  </svg>

  <nav>
    <div class="wrap">
      <a class="brand" href="index.html">
        <svg class="logo" role="img" aria-label="4-testing logo"><use href="#logo"/></svg>
        4-testing
      </a>
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="wrap">
    <header>
      <h1>Contact</h1>
    </header>

    <main>
      <form action="mailto:milo@4-testing.nl?subject=Message%20via%204-testing.nl" method="post" enctype="text/plain">
        <label>Name
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button type="submit">Send message</button>
      </form>
    </main>

    <footer>&copy; 2026 4-testing &middot; Milo van der Kruis</footer>
  </div>
</body>
</html>
